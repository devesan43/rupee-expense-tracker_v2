name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Clean Flutter
        run: flutter clean

      - name: Clean Gradle
        run: |
          rm -rf android/.gradle
          rm -rf android/app/build
          rm -rf build

      - name: Set compileSdk 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle

      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      - name: Locate APK
        if: always()
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"
          find . -type f -name "*.apk" -print

          echo "======================================"
          echo "BUILD DIRECTORY"
          echo "======================================"
          find build -type f 2>/dev/null | head -200

          echo "======================================"
          echo "ANDROID BUILD DIRECTORY"
          echo "======================================"
          find android/app/build -type f -name "*.apk" -print 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
