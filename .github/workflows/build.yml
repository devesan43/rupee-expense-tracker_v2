  Future<void>exportPdf() async {
    final document = pw.Document();

    final income =
        monthlyTotal('Income');

    final expenses =
        monthlyTotal('Expense');

    final savings =
        monthlyTotal('Savings');

    final credit =
        monthlyTotal('Credit');

    final month =
        DateFormat('MMMM yyyy')
            .format(DateTime.now());

    document.addPage(
      pw.MultiPage(
        build: (context) {
          return [
            pw.Header(
              level: 0,
              child: pw.Text(
                'Expense Tracker',
              ),
            ),
            pw.Text(
              'Monthly Financial Report - $month',
            ),
            pw.SizedBox(height: 12),
            pw.Text(
              'Income: ₹${income.toStringAsFixed(2)}',
            ),
            pw.Text(
              'Expenses: ₹${expenses.toStringAsFixed(2)}',
            ),
            pw.Text(
              'Savings: ₹${savings.toStringAsFixed(2)}',
            ),
            pw.Text(
              'Credit / Loan Payments: ₹${credit.toStringAsFixed(2)}',
            ),
            pw.SizedBox(height: 15),
            pw.TableHelper.fromTextArray(
              headers: [
                'Date',
                'Type',
                'Account',
                'Category',
                'Amount',
              ],
              data: data
                  .where(
                    (t) => t.date.startsWith(
                      DateFormat(
                        'yyyy-MM',
                      ).format(
                        DateTime.now(),
