                            reference:
                                old?.reference,
                          );

                          if (old == null) {
                            await DB
                                .insertTransaction(
                              transaction,
                            );
                          } else {
                            await DB
                                .updateTransaction(
                              transaction,
                            );
                          }

                          if (sheetContext.mounted) {
                            Navigator.pop(
                              sheetContext,
                            );
                          }

                          await load();
                        },
                        child: Text(
                          old == null
                              ? 'Save Transaction'
                              : 'Update Transaction',
                        ),
                      ),
                    ),
                  ],
                ),
              ),
            );
          },
        );
      },
    );
  }

