  // ==========================================================
  // PIN / SECURITY
  // ==========================================================

  Future<void>securitySettings() async {
    final prefs =
        await SharedPreferences.getInstance();

    final pinController =
        TextEditingController(
      text: prefs.getString('pin') ?? '',
    );

    bool biometric =
        prefs.getBool('biometric') ?? false;

    int autoLock =
        prefs.getInt('autoLockMinutes') ?? 0;

    await showDialog(
      context: context,
      builder: (dialogContext) {
        return StatefulBuilder(
          builder: (
            context,
            setDialogState,
          ) {
            return AlertDialog(
              title: const Text(
                'Security Settings',
              ),
              content:
                  SingleChildScrollView(
                child: Column(
                  children: [
                    TextField(
                      controller:
                          pinController,
                      obscureText: true,
                      maxLength: 6,
                      keyboardType:
                          TextInputType.number,
                      decoration:
                          const InputDecoration(
                        labelText:
                            'PIN (4-6 digits)',
                      ),
                    ),
                    SwitchListTile(
                      title: const Text(
                        'Fingerprint / Biometric',
                      ),
                      value: biometric,
                      onChanged: (value) async {
                        if (value) {
                          final auth =
                              LocalAuthentication();

                          bool supported = false;

                          try {
                            supported =
                                await auth
                                        .isDeviceSupported() ||
                                    await auth
                                        .canCheckBiometrics;
                          } catch (_) {}

                          if (!supported) {
                            if (mounted) {
                              ScaffoldMessenger.of(
                                      context)
                                  .showSnackBar(
                                const SnackBar(
                                  content: Text(
                                    'Biometric authentication is not available',
                                  ),
                                ),
                              );
                            }
                            return;
                          }
                        }

                        setDialogState(() {
                          biometric = value;
                        });
                      },
                    ),
                    DropdownButtonFormField<int>(
                      value: autoLock,
                      decoration:
                          const InputDecoration(
                        labelText:
                            'Auto-lock',
                      ),
                      items: const [
                        DropdownMenuItem(
                          value: 0,
                          child:
                              Text('Disabled'),
                        ),
                        DropdownMenuItem(
                          value: 1,
                          child:
                              Text('After 1 minute'),
                        ),
                        DropdownMenuItem(
                          value: 5,
                          child:
                              Text('After 5 minutes'),
                        ),
                        DropdownMenuItem(
                          value: 10,
                          child:
                              Text('After 10 minutes'),
                        ),
                        DropdownMenuItem(
                          value: 30,
                          child:
                              Text('After 30 minutes'),
                        ),
                      ],
                      onChanged: (value) {
                        if (value == null) {
                          return;
                        }

                        setDialogState(() {
                          autoLock = value;
                        });
                      },
                    ),
                  ],
                ),
              ),
              actions: [
                ElevatedButton(
                  onPressed: () async {
                    final pin =
                        pinController.text
                            .trim();

                    if (pin.isNotEmpty &&
                        (pin.length < 4 ||
                            pin.length > 6)) {
                      return;
                    }

                    if (pin.isEmpty) {
                      await prefs.remove(
                        'pin',
                      );
                    } else {
                      await prefs.setString(
                        'pin',
                        pin,
                      );
                    }

                    await prefs.setBool(
                      'biometric',
                      biometric,
                    );

                    await prefs.setInt(
                      'autoLockMinutes',
                      autoLock,
                    );

                    if (dialogContext.mounted) {
                      Navigator.pop(
                        dialogContext,
                      );
                    }

                    if (mounted) {
                      ScaffoldMessenger.of(
                              context)
                          .showSnackBar(
                        const SnackBar(
                          content: Text(
                            'Security settings saved',
                          ),
                        ),
                      );
                    }
                  },
                  child: const Text(
                    'Save',
                  ),
                ),
              ],
            );
          },
        );
      },
    );
  }

  // ==========================================================
  // DELETE
  // ==========================================================

  Future<void>deleteTransaction(
    TransactionModel transaction,
  ) async {
    if (transaction.id == null) {
      return;
    }

    final confirm =
        await showDialog<bool>(
      context: context,
      builder: (context) {
        return AlertDialog(
          title: const Text(
            'Delete Transaction?',
          ),
          content: Text(
            'Delete ₹${transaction.amount.toStringAsFixed(2)}?',
          ),
          actions: [
            TextButton(
              onPressed: () =>
                  Navigator.pop(
                context,
                false,
              ),
              child:
                  const Text('Cancel'),
            ),
            ElevatedButton(
              onPressed: () =>
                  Navigator.pop(
                context,
                true,
              ),
              child:
                  const Text('Delete'),
            ),
          ],
        );
      },
    );

    if (confirm == true) {
      await DB.deleteTransaction(
        transaction.id!,
      );

      await load();
    }
  }

