// ============================================================
// TRANSACTION MODEL
// ============================================================

class TransactionModel {
  int? id;
  double amount;
  String type;
  String account;
  String category;
  String subCategory;
  String date;
  String description;
  String? toAccount;
  String? bank;
  String? merchant;
  String? reference;
  String? source;

  TransactionModel({
    this.id,
    required this.amount,
    required this.type,
    required this.account,
    required this.category,
    required this.subCategory,
    required this.date,
    required this.description,
    this.toAccount,
    this.bank,
    this.merchant,
    this.reference,
    this.source,
  });

  Map<String, dynamic> toMap() {
    return {
      'id': id,
      'amount': amount,
      'type': type,
      'account': account,
      'toAccount': toAccount,
      'category': category,
      'subCategory': subCategory,
      'date': date,
      'description': description,
      'bank': bank,
      'merchant': merchant,
      'reference': reference,
      'source': source,
    };
  }

  factory TransactionModel.fromMap(Map<String, dynamic> m) {
    return TransactionModel(
      id: m['id'],
      amount: (m['amount'] as num).toDouble(),
      type: m['type'] ?? 'Expense',
      account: m['account'] ?? 'Cash',
      toAccount: m['toAccount'],
      category: m['category'] ?? 'Other',
      subCategory: m['subCategory'] ?? '',
      date: m['date'] ?? '',
      description: m['description'] ?? '',
      bank: m['bank'],
      merchant: m['merchant'],
      reference: m['reference'],
      source: m['source'],
    );
  }
}

// ============================================================
// RECURRING MODEL
// ============================================================

class RecurringExpense {
  int? id;
  String name;
  String account;
  String category;
  double amount;
  int day;
  String frequency;

  RecurringExpense({
    this.id,
    required this.name,
    required this.account,
    required this.category,
    required this.amount,
    required this.day,
    this.frequency = 'Monthly',
  });

  Map<String, dynamic> toMap() {
    return {
      'id': id,
      'name': name,
      'account': account,
      'category': category,
      'amount': amount,
      'day': day,
      'frequency': frequency,
    };
  }

  factory RecurringExpense.fromMap(Map<String, dynamic> m) {
    return RecurringExpense(
      id: m['id'],
      name: m['name'] ?? '',
      account: m['account'] ?? 'Bank Account',
      category: m['category'] ?? 'Bills',
      amount: (m['amount'] as num).toDouble(),
      day: m['day'] ?? 1,
      frequency: m['frequency'] ?? 'Monthly',
    );
  }
}

// ============================================================
// DATABASE
// ============================================================

class DB {
  static Database? _database;

  static Future<Database> get database async {
    if (_database != null) return _database!;

    final path = p.join(
      await getDatabasesPath(),
      'expense_tracker.db',
    );

    _database = await openDatabase(
      path,
      version: 2,
      onCreate: (db, version) async {
        await _createTables(db);

        for (final account in [
          'Cash',
          'Bank Account',
          'Credit Card',
        ]) {
          await db.insert(
            'balances',
            {
              'account': account,
              'opening': 0.0,
            },
            conflictAlgorithm: ConflictAlgorithm.ignore,
          );
        }
      },
      onUpgrade: (db, oldVersion, newVersion) async {
        if (oldVersion < 2) {
          await _safeAddColumn(db, 'transactions', 'bank', 'TEXT');
          await _safeAddColumn(db, 'transactions', 'merchant', 'TEXT');
          await _safeAddColumn(db, 'transactions', 'reference', 'TEXT');
          await _safeAddColumn(db, 'transactions', 'source', 'TEXT');

          await _safeAddColumn(
            db,
            'recurring',
            'frequency',
            "TEXT DEFAULT 'Monthly'",
          );
        }
      },
    );

    return _database!;
  }

  static Future<void> _createTables(Database db) async {
    await db.execute('''
      CREATE TABLE transactions(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        amount REAL NOT NULL,
        type TEXT NOT NULL,
        account TEXT NOT NULL,
        toAccount TEXT,
        category TEXT,
        subCategory TEXT,
        date TEXT,
        description TEXT,
        bank TEXT,
        merchant TEXT,
        reference TEXT,
        source TEXT
      )
    ''');

    await db.execute('''
      CREATE TABLE categories(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        name TEXT NOT NULL,
        type TEXT NOT NULL
      )
    ''');

    await db.execute('''
      CREATE TABLE balances(
        account TEXT PRIMARY KEY,
        opening REAL NOT NULL
      )
    ''');

    await db.execute('''
      CREATE TABLE budgets(
        month TEXT NOT NULL,
        category TEXT NOT NULL,
        amount REAL NOT NULL,
        PRIMARY KEY(month, category)
      )
    ''');

    await db.execute('''
      CREATE TABLE recurring(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        name TEXT NOT NULL,
        account TEXT NOT NULL,
        category TEXT NOT NULL,
        amount REAL NOT NULL,
        day INTEGER NOT NULL,
        frequency TEXT DEFAULT 'Monthly'
      )
    ''');
  }

  static Future<void> _safeAddColumn(
    Database db,
    String table,
    String column,
    String type,
  ) async {
    try {
      await db.execute(
        'ALTER TABLE $table ADD COLUMN $column $type',
      );
    } catch (_) {}
  }

  static Future<List<TransactionModel>> allTransactions() async {
    final db = await database;

    final rows = await db.query(
      'transactions',
      orderBy: 'date DESC, id DESC',
    );

    return rows.map(TransactionModel.fromMap).toList();
  }

  static Future<int> insertTransaction(
    TransactionModel transaction,
  ) async {
    final db = await database;

    return db.insert(
      'transactions',
      transaction.toMap(),
    );
  }

  static Future<void> updateTransaction(
    TransactionModel transaction,
  ) async {
    final db = await database;

    await db.update(
      'transactions',
      transaction.toMap(),
      where: 'id=?',
      whereArgs: [transaction.id],
    );
  }

  static Future<void> deleteTransaction(int id) async {
    final db = await database;

    await db.delete(
      'transactions',
      where: 'id=?',
      whereArgs: [id],
    );
  }

  static Future<List<String>> categories(String type) async {
    final defaults = <String, List<String>>{
      'Expense': [
        'Food',
        'Bills',
        'Travel',
        'Shopping',
        'Health',
        'Education',
        'Utilities',
        'Rent',
        'EMI',
        'Insurance',
        'Subscription',
        'Other',
      ],
      'Income': [
        'Salary',
        'Business',
        'Investment',
        'Gift',
        'Other',
      ],
      'Savings': [
        'Emergency Fund',
        'FD',
        'Mutual Funds',
        'Gold',
        'Other',
      ],
      'Credit': [
        'Personal Loan',
        'Loan Payment',
        'Credit Card Payment',
        'Borrowed',
        'Lent',
        'Other',
      ],
      'Transfer': [
        'Account Transfer',
      ],
    };

    final result = <String>{
      ...(defaults[type] ?? ['Other']),
    };

    final db = await database;

    final rows = await db.query(
      'categories',
      where: 'type=?',
      whereArgs: [type],
    );

    for (final row in rows) {
      result.add(row['name'] as String);
    }

    return result.toList();
  }

  static Future<void> addCategory(
    String name,
    String type,
  ) async {
    final db = await database;

    await db.insert(
      'categories',
      {
        'name': name,
        'type': type,
      },
    );
  }

  static Future<double> openingBalance(
    String account,
  ) async {
    final db = await database;

    final rows = await db.query(
      'balances',
      where: 'account=?',
      whereArgs: [account],
    );

    if (rows.isEmpty) return 0;

    return (rows.first['opening'] as num).toDouble();
  }

  static Future<void> setOpeningBalance(
    String account,
    double value,
  ) async {
    final db = await database;

    await db.insert(
      'balances',
      {
        'account': account,
        'opening': value,
      },
      conflictAlgorithm: ConflictAlgorithm.replace,
    );
  }

  static Future<Map<String, double>> budgets(
    String month,
  ) async {
    final db = await database;

    final rows = await db.query(
      'budgets',
      where: 'month=?',
      whereArgs: [month],
    );

    return {
      for (final row in rows)
        row['category'] as String:
            (row['amount'] as num).toDouble(),
    };
  }

  static Future<void> setBudget(
    String month,
    String category,
    double amount,
  ) async {
    final db = await database;

    await db.insert(
      'budgets',
      {
        'month': month,
        'category': category,
        'amount': amount,
      },
      conflictAlgorithm: ConflictAlgorithm.replace,
    );
  }

  static Future<List<RecurringExpense>> recurring() async {
    final db = await database;

    final rows = await db.query(
      'recurring',
      orderBy: 'day ASC',
    );

    return rows.map(RecurringExpense.fromMap).toList();
  }

  static Future<void> addRecurring(
    RecurringExpense item,
  ) async {
    final db = await database;

    await db.insert(
      'recurring',
      item.toMap(),
    );
  }

  static Future<void> deleteRecurring(int id) async {
    final db = await database;

    await db.delete(
      'recurring',
      where: 'id=?',
      whereArgs: [id],
    );
  }
}

// ============================================================
// LOCK GATE
// ============================================================

class LockGate extends StatefulWidget {
  const LockGate({super.key});

  @override
  State<LockGate> createState() => _LockGateState();
}

class _LockGateState extends State<LockGate>
    with WidgetsBindingObserver {
  final LocalAuthentication auth = LocalAuthentication();
  final TextEditingController pinController =
      TextEditingController();

  bool loading = true;
  bool locked = false;
  bool biometricAvailable = false;
  DateTime? backgroundTime;

  @override
  void initState() {
    super.initState();
    WidgetsBinding.instance.addObserver(this);
    initialise();
  }

  @override
  void dispose() {
    WidgetsBinding.instance.removeObserver(this);
    pinController.dispose();
    super.dispose();
  }

  Future<void> initialise() async {
    final prefs = await SharedPreferences.getInstance();

    final pin = prefs.getString('pin');

    if (pin != null && pin.isNotEmpty) {
      locked = true;
    }

    try {
      biometricAvailable =
          await auth.isDeviceSupported() ||
              await auth.canCheckBiometrics;
    } catch (_) {
      biometricAvailable = false;
    }

    if (locked &&
        prefs.getBool('biometric') == true &&
        biometricAvailable) {
      await unlockBiometric();
    }

    if (mounted) {
      setState(() {
        loading = false;
      });
    }
  }

  Future<void> unlockBiometric() async {
    try {
      final success = await auth.authenticate(
        localizedReason:
            'Unlock Expense Tracker',
        options: const AuthenticationOptions(
          biometricOnly: false,
          stickyAuth: true,
          useErrorDialogs: true,
        ),
      );

      if (success && mounted) {
        setState(() {
          locked = false;
        });
      }
    } catch (_) {}
  }

  Future<void> unlockPin() async {
    final prefs = await SharedPreferences.getInstance();

    if (pinController.text ==
        prefs.getString('pin')) {
      if (mounted) {
        setState(() {
          locked = false;
        });
      }
    } else {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(
            content: Text('Incorrect PIN'),
          ),
        );
      }
    }
  }

  @override
  void didChangeAppLifecycleState(
    AppLifecycleState state,
  ) {
    if (state == AppLifecycleState.paused) {
      backgroundTime = DateTime.now();
    }

    if (state == AppLifecycleState.resumed) {
      checkAutoLock();
    }
  }

  Future<void> checkAutoLock() async {
    final prefs = await SharedPreferences.getInstance();

    final minutes =
        prefs.getInt('autoLockMinutes') ?? 0;

    if (minutes <= 0 || backgroundTime == null) {
      return;
    }

    final elapsed =
        DateTime.now().difference(backgroundTime!);

    if (elapsed.inMinutes >= minutes &&
        prefs.getString('pin') != null) {
      if (mounted) {
        setState(() {
          locked = true;
        });
      }

      if (prefs.getBool('biometric') == true &&
          biometricAvailable) {
        await unlockBiometric();
      }
    }
  }

  @override
  Widget build(BuildContext context) {
    if (loading) {
      return const Scaffold(
        body: Center(
          child: CircularProgressIndicator(),
        ),
      );
    }

    if (!locked) {
      return const Home();
    }

    return Scaffold(
      body: Center(
        child: Padding(
          padding: const EdgeInsets.all(32),
          child: Column(
            mainAxisSize: MainAxisSize.min,
            children: [
              const Icon(
                Icons.lock,
                size: 70,
              ),
              const SizedBox(height: 16),
              const Text(
                'Expense Tracker',
                style: TextStyle(
                  fontSize: 24,
                  fontWeight: FontWeight.bold,
                ),
              ),
              const SizedBox(height: 20),
              TextField(
                controller: pinController,
                obscureText: true,
                keyboardType:
                    TextInputType.number,
                decoration: const InputDecoration(
                  labelText: 'PIN',
                  border: OutlineInputBorder(),
                ),
              ),
              const SizedBox(height: 12),
              SizedBox(
                width: double.infinity,
                child: ElevatedButton(
                  onPressed: unlockPin,
                  child: const Text('Unlock'),
                ),
              ),
              if (biometricAvailable)
                TextButton.icon(
                  onPressed: unlockBiometric,
                  icon: const Icon(
                    Icons.fingerprint,
                  ),
                  label: const Text(
                    'Use Fingerprint / Biometric',
                  ),
                ),
            ],
          ),
        ),
      ),
    );
  }
}

// ============================================================
// HOME
// ============================================================

class Home extends StatefulWidget {
  const Home({super.key});

  @override
  State<Home> createState() => _HomeState();
}

class _HomeState extends State<Home> {
  final accounts = const [
    'Cash',
    'Bank Account',
    'Credit Card',
  ];

  final types = const [
    'Expense',
    'Income',
    'Savings',
    'Credit',
    'Transfer',
  ];

  List<TransactionModel> data = [];
  List<TransactionModel> shown = [];

  List<RecurringExpense> recurringItems = [];

  Map<String, double> balances = {};
  Map<String, double> budgets = {};

  String period = 'Monthly';
  String accountFilter = 'All';
  String search = '';

  DateTimeRange? selectedDates;

  @override
  void initState() {
    super.initState();
    load();
  }

  Future<void> load() async {
    await createDueRecurringTransactions();

    data = await DB.allTransactions();

    recurringItems = await DB.recurring();

    budgets = await DB.budgets(
      DateFormat('yyyy-MM').format(DateTime.now()),
    );

    balances = {};

    for (final account in accounts) {
      balances[account] =
          await DB.openingBalance(account);
    }

    for (final transaction in data) {
      if (transaction.type == 'Income') {
        balances[transaction.account] =
            (balances[transaction.account] ?? 0) +
                transaction.amount;
      }

      if (transaction.type == 'Expense' ||
          transaction.type == 'Credit') {
        balances[transaction.account] =
            (balances[transaction.account] ?? 0) -
                transaction.amount;
      }

      if (transaction.type == 'Savings') {
        balances[transaction.account] =
            (balances[transaction.account] ?? 0) -
                transaction.amount;
      }

      if (transaction.type == 'Transfer') {
        balances[transaction.account] =
            (balances[transaction.account] ?? 0) -
                transaction.amount;

        if (transaction.toAccount != null) {
          balances[transaction.toAccount!] =
              (balances[transaction.toAccount!] ?? 0) +
                  transaction.amount;
        }
      }
    }

    applyFilters();

    if (mounted) {
      setState(() {});
    }
  }

  // ==========================================================
  // AUTOMATIC RECURRING TRANSACTIONS
  // ==========================================================

  Future<void> createDueRecurringTransactions() async {
    final items = await DB.recurring();

    final today = DateTime.now();

    for (final item in items) {
      if (item.frequency != 'Monthly') {
        continue;
      }

      if (today.day < item.day) {
        continue;
      }

      final dueDate = DateTime(
        today.year,
        today.month,
        item.day.clamp(
          1,
          DateTime(
            today.year,
            today.month + 1,
            0,
          ).day,
        ),
      );

      final month =
          DateFormat('yyyy-MM').format(dueDate);

      final existing =
          await DB.allTransactions();

      final alreadyCreated = existing.any(
        (t) =>
            t.source == 'Recurring' &&
            t.category == item.category &&
            t.description ==
                'Recurring: ${item.name}' &&
            t.date.startsWith(month),
      );

      if (!alreadyCreated) {
        await DB.insertTransaction(
          TransactionModel(
            amount: item.amount,
            type: 'Expense',
            account: item.account,
            category: item.category,
            subCategory: 'Recurring',
            date: DateFormat(
              'yyyy-MM-dd HH:mm',
            ).format(dueDate),
            description:
                'Recurring: ${item.name}',
            source: 'Recurring',
          ),
        );
      }
    }
  }

  // ==========================================================
  // FILTER
  // ==========================================================

  void applyFilters() {
    final now = DateTime.now();

    shown = data.where((transaction) {
      final date =
          DateTime.tryParse(transaction.date) ??
              now;

      if (accountFilter != 'All' &&
          transaction.account !=
              accountFilter) {
        return false;
      }

      if (selectedDates != null) {
        final start =
            DateTime(
              selectedDates!.start.year,
              selectedDates!.start.month,
              selectedDates!.start.day,
            );

        final end =
            DateTime(
              selectedDates!.end.year,
              selectedDates!.end.month,
              selectedDates!.end.day,
              23,
              59,
              59,
            );

        if (date.isBefore(start) ||
            date.isAfter(end)) {
          return false;
        }
      } else {
        if (period == 'Daily' &&
            !transaction.date.startsWith(
              DateFormat(
                'yyyy-MM-dd',
              ).format(now),
            )) {
          return false;
        }

        if (period == 'Monthly' &&
            !transaction.date.startsWith(
              DateFormat(
                'yyyy-MM',
              ).format(now),
            )) {
          return false;
        }

        if (period == 'Yearly' &&
            !transaction.date.startsWith(
              DateFormat(
                'yyyy',
              ).format(now),
            )) {
          return false;
        }
      }

      if (search.isNotEmpty) {
        final text = [
          transaction.category,
          transaction.subCategory,
          transaction.description,
          transaction.account,
          transaction.bank ?? '',
          transaction.merchant ?? '',
          transaction.reference ?? '',
        ].join(' ').toLowerCase();

        if (!text.contains(search.toLowerCase())) {
          return false;
        }
      }

      return true;
    }).toList();
  }

  double total(String type) {
    return shown
        .where((t) => t.type == type)
        .fold(
          0.0,
          (sum, t) => sum + t.amount,
        );
  }

  double monthlyTotal(String type) {
    final month =
        DateFormat('yyyy-MM').format(DateTime.now());

    return data
        .where(
          (t) =>
              t.type == type &&
              t.date.startsWith(month),
        )
        .fold(
          0.0,
          (sum, t) => sum + t.amount,
        );
  }

  // ==========================================================
  // ADD / EDIT TRANSACTION
  // ==========================================================

  Future<void> editTransaction(
    [TransactionModel? old],
  ) async {
    final amountController =
        TextEditingController(
      text: old?.amount.toString() ?? '',
    );

    final descriptionController =
        TextEditingController(
      text: old?.description ?? '',
    );

    final subController =
        TextEditingController(
      text: old?.subCategory ?? '',
    );

    String type =
        old?.type ?? 'Expense';

    String account =
        old?.account ?? 'Cash';

    String toAccount =
        old?.toAccount ?? 'Bank Account';

    String category =
        old?.category ?? 'Other';

    List<String> categoryList =
        await DB.categories(type);

    if (!categoryList.contains(category)) {
      category = categoryList.first;
    }

    await showModalBottomSheet(
      context: context,
      isScrollControlled: true,
      builder: (sheetContext) {
        return StatefulBuilder(
          builder: (
            context,
            setModalState,
          ) {
            return Padding(
              padding: EdgeInsets.fromLTRB(
                16,
                16,
                16,
                MediaQuery.of(context)
                        .viewInsets
                        .bottom +
                    16,
              ),
              child: SingleChildScrollView(
                child: Column(
                  children: [
                    Text(
                      old == null
                          ? 'Add Transaction'
                          : 'Edit Transaction',
                      style: const TextStyle(
                        fontSize: 22,
                        fontWeight:
                            FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 16),

                    DropdownButtonFormField<String>(
                      value: type,
                      decoration:
                          const InputDecoration(
                        labelText: 'Type',
                        border:
                            OutlineInputBorder(),
                      ),
                      items: types
                          .map(
                            (value) =>
                                DropdownMenuItem(
                              value: value,
                              child: Text(value),
                            ),
                          )
                          .toList(),
                      onChanged: (value) async {
                        if (value == null) return;

                        final list =
                            await DB.categories(
                          value,
                        );

                        setModalState(() {
                          type = value;
                          category = list.first;
                          categoryList = list;
                        });
                      },
                    ),

                    const SizedBox(height: 10),

                    DropdownButtonFormField<String>(
                      value: account,
                      decoration:
                          const InputDecoration(
                        labelText: 'Account',
                        border:
                            OutlineInputBorder(),
                      ),
                      items: accounts
                          .map(
                            (value) =>
                                DropdownMenuItem(
                              value: value,
                              child: Text(value),
                            ),
                          )
                          .toList(),
                      onChanged: (value) {
                        if (value == null) return;

                        setModalState(() {
                          account = value;

                          if (toAccount ==
                              account) {
                            toAccount =
                                accounts.firstWhere(
                              (x) =>
                                  x != account,
                              orElse: () =>
                                  'Bank Account',
                            );
                          }
                        });
                      },
                    ),

                    if (type == 'Transfer') ...[
                      const SizedBox(height: 10),
