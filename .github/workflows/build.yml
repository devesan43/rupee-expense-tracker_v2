  // ==========================================================
  // EXCEL
  // ==========================================================

  Future<void>exportExcel() async {
    final excel =
        ex.Excel.createExcel();

    final sheet =
        excel['Transactions'];

    sheet.appendRow([
      ex.TextCellValue('Date'),
      ex.TextCellValue('Type'),
      ex.TextCellValue('Account'),
      ex.TextCellValue('To Account'),
      ex.TextCellValue('Category'),
      ex.TextCellValue('Sub-category'),
      ex.TextCellValue('Amount'),
      ex.TextCellValue('Description'),
      ex.TextCellValue('Bank'),
      ex.TextCellValue('Merchant'),
      ex.TextCellValue('Reference'),
      ex.TextCellValue('Source'),
    ]);

    for (final t in data) {
      sheet.appendRow([
        ex.TextCellValue(t.date),
        ex.TextCellValue(t.type),
        ex.TextCellValue(t.account),
        ex.TextCellValue(
          t.toAccount ?? '',
        ),
        ex.TextCellValue(t.category),
        ex.TextCellValue(
          t.subCategory,
        ),
        ex.DoubleCellValue(t.amount),
        ex.TextCellValue(
          t.description,
        ),
        ex.TextCellValue(
          t.bank ?? '',
        ),
        ex.TextCellValue(
          t.merchant ?? '',
        ),
        ex.TextCellValue(
          t.reference ?? '',
        ),
        ex.TextCellValue(
          t.source ?? 'Manual',
        ),
      ]);
    }

    final bytes = excel.encode();

    if (bytes == null) return;

    final directory =
        await FilePicker.platform
            .getDirectoryPath();

    if (directory == null) return;

    final file = File(
      p.join(
        directory,
        'expense_tracker_report.xlsx',
      ),
    );

    await file.writeAsBytes(bytes);

    if (mounted) {
      ScaffoldMessenger.of(context)
          .showSnackBar(
        SnackBar(
          content: Text(
            'Excel saved: ${file.path}',
          ),
        ),
      );
    }
  }

