            // --------------------------------------------------

            const Padding(
              padding:
                  EdgeInsets.all(8),
              child: Text(
                'Transactions',
                style: TextStyle(
                  fontSize: 18,
                  fontWeight:
                      FontWeight.bold,
                ),
              ),
            ),

            if (shown.isEmpty)
              const Card(
                child: Padding(
                  padding:
                      EdgeInsets.all(24),
                  child: Center(
                    child: Text(
                      'No transactions found',
                    ),
                  ),
                ),
              ),

            ...shown.map(
              (transaction) {
                final isIncome =
                    transaction.type ==
                        'Income';

                final isTransfer =
                    transaction.type ==
                        'Transfer';

                return Card(
                  child: ListTile(
                    leading: CircleAvatar(
                      child: Icon(
                        isTransfer
                            ? Icons.swap_horiz
                            : isIncome
                                ? Icons
                                    .arrow_downward
                                : Icons
                                    .arrow_upward,
                      ),
                    ),
                    title: Text(
                      isTransfer
                          ? '${transaction.account} → ${transaction.toAccount}'
                          : transaction
                              .category,
                      style:
                          const TextStyle(
                        fontWeight:
                            FontWeight.bold,
                      ),
                    ),
                    subtitle: Text(
                      [
                        transaction
                            .subCategory,
                        transaction.account,
                        transaction.date,
                        transaction
                            .description,
                        if (transaction
                                .merchant
                                ?.isNotEmpty ==
                            true)
                          transaction
                              .merchant!,
                        if (transaction
                                .bank
                                ?.isNotEmpty ==
                            true)
                          transaction.bank!,
                      ].where(
                        (x) =>
                            x.isNotEmpty,
                      ).join(' • '),
                    ),
                    isThreeLine: true,
                    trailing:
                        Row(
                      mainAxisSize:
                          MainAxisSize.min,
                      children: [
                        Text(
                          '${isIncome ? '+' : '-'}₹${transaction.amount.toStringAsFixed(2)}',
                          style:
                              TextStyle(
                            color: isIncome
                                ? Colors.green
                                : Colors.red,
                            fontWeight:
                                FontWeight.bold,
                          ),
                        ),
                        PopupMenuButton<
                            String>(
                          onSelected:
                              (value) {
                            if (value ==
                                'edit') {
                              editTransaction(
                                transaction,
                              );
                            }

                            if (value ==
                                'delete') {
                              deleteTransaction(
                                transaction,
                              );
                            }
                          },
                          itemBuilder:
                              (context) =>
                                  const [
                            PopupMenuItem(
                              value:
                                  'edit',
                              child:
                                  Text(
                                'Edit',
                              ),
                            ),
                            PopupMenuItem(
                              value:
                                  'delete',
                              child:
                                  Text(
                                'Delete',
                              ),
                            ),
                          ],
                        ),
                      ],
                    ),
                  ),
                );
              },
            ),
          ],
        ),
      ),

      floatingActionButton:
          FloatingActionButton.extended(
        onPressed:
            () => editTransaction(),
        icon: const Icon(
          Icons.add,
        ),
        label: const Text(
          'Add Expense',
        ),
      ),
    );
  }

  Widget summaryCard(
    String title,
    double amount,
    Color color,
  ) {
    return Card(
      child: Padding(
        padding:
            const EdgeInsets.all(12),
        child: Column(
          children: [
            Text(
              title,
              style:
                  const TextStyle(
                fontSize: 12,
              ),
            ),
            const SizedBox(
              height: 5,
            ),
            Text(
              '₹${amount.toStringAsFixed(0)}',
              style: TextStyle(
                fontSize: 18,
                fontWeight:
                    FontWeight.bold,
                color: color,
              ),
            ),
          ],
        ),
      ),
    );
  }

  static Widget _barTitle(
    double value,
    TitleMeta meta,
  ) {
    String text;

    switch (value.toInt()) {
      case 0:
        text = 'Income';
        break;
      case 1:
        text = 'Expense';
        break;
      case 2:
        text = 'Savings';
        break;
      default:
        text = '';
    }

    return SideTitleWidget(
      axisSide: meta.axisSide,
      child: Text(
        text,
        style:
            const TextStyle(fontSize: 10),
      ),
    );
  }
}
