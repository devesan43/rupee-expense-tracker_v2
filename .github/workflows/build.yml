  // ==========================================================
  // SMS AUTOMATION
  // ==========================================================

  String detectBank(String body) {
    final text = body.toLowerCase();

    final banks = <String, List<String>>{
      'SBI': [
        'sbi',
        'state bank',
        'sbicard',
      ],
      'HDFC': [
        'hdfc',
      ],
      'ICICI': [
        'icici',
      ],
      'Axis': [
        'axis',
      ],
      'Kotak': [
        'kotak',
      ],
      'Canara': [
        'canara',
      ],
      'Federal Bank': [
        'federal',
      ],
      'Bank of Baroda': [
        'bank of baroda',
        'bob',
      ],
      'PNB': [
        'pnb',
        'punjab national',
      ],
      'IDFC': [
        'idfc',
      ],
      'IndusInd': [
        'indusind',
      ],
      'Yes Bank': [
        'yes bank',
      ],
    };

    for (final entry in banks.entries) {
      for (final word in entry.value) {
        if (text.contains(word)) {
          return entry.key;
        }
      }
    }

    return 'Unknown Bank';
  }

  String detectMerchant(String body) {
    final text = body.toLowerCase();

    final known = <String>[
      'swiggy',
      'zomato',
      'amazon',
      'flipkart',
      'uber',
      'ola',
      'zepto',
      'blinkit',
      'myntra',
      'netflix',
      'spotify',
      'google',
      'apple',
      'phonepe',
      'gpay',
      'google pay',
      'paytm',
    ];

    for (final merchant in known) {
      if (text.contains(merchant)) {
        return merchant.toUpperCase();
      }
    }

    return '';
  }

  String detectAccount(String body) {
    final text = body.toLowerCase();

    if (text.contains('credit card') ||
        text.contains('card ending') ||
        text.contains('card xx') ||
        text.contains('card no')) {
      return 'Credit Card';
    }

    return 'Bank Account';
  }

  String detectCategory(String body) {
    final text = body.toLowerCase();

    if (text.contains('swiggy') ||
        text.contains('zomato') ||
        text.contains('restaurant') ||
        text.contains('food')) {
      return 'Food';
    }

    if (text.contains('uber') ||
        text.contains('ola') ||
        text.contains('fuel') ||
        text.contains('petrol') ||
        text.contains('diesel')) {
      return 'Travel';
    }

    if (text.contains('electricity') ||
        text.contains('kseb') ||
        text.contains('recharge') ||
        text.contains('bill')) {
      return 'Bills';
    }

    if (text.contains('school') ||
        text.contains('college') ||
        text.contains('education')) {
      return 'Education';
    }

    if (text.contains('emi') ||
        text.contains('loan')) {
      return 'EMI';
    }

    if (text.contains('insurance')) {
      return 'Insurance';
    }

    if (text.contains('netflix') ||
        text.contains('spotify') ||
        text.contains('subscription')) {
      return 'Subscription';
    }

    return 'Other';
  }

  String detectUpi(String body) {
    final match = RegExp(
      r'(?i)(upi|vpa|upi ref|upi id)',
    ).firstMatch(body);

    return match == null ? '' : 'UPI';
  }

  Future<void>processSms() async {
    final permission =
        await Permission.sms.request();

    if (!permission.isGranted) {
      if (mounted) {
        ScaffoldMessenger.of(context)
            .showSnackBar(
          const SnackBar(
            content: Text(
              'SMS permission is required',
            ),
          ),
        );
      }

      return;
    }

    final smsQuery = SmsQuery();

    final messages =
        await smsQuery.querySms(
      kinds: [
        SmsQueryKind.inbox,
      ],
      count: 200,
    );

    final existing =
        await DB.allTransactions();

    int added = 0;
    int skipped = 0;

    final amountRegex = RegExp(
      r'(?:debited|debit|spent|paid|withdrawn|credited|credit|received|sent)'
      r'\D{0,40}'
      r'(?:rs\.?|inr|₹)?\s*'
      r'([0-9,]+(?:\.[0-9]+)?)',
      caseSensitive: false,
    );

    for (final message in messages) {
      final body =
          message.body?.trim() ?? '';

      if (body.isEmpty) continue;

      final match =
          amountRegex.firstMatch(body);

      if (match == null) continue;

      final amount =
          double.tryParse(
                match.group(1)!
                    .replaceAll(',', ''),
              ) ??
              0;

      if (amount <= 0) continue;

      final lower = body.toLowerCase();

      final isIncome =
          lower.contains('credited') ||
              lower.contains('received') ||
              lower.contains('credit');

      final date =
          message.date ?? DateTime.now();

      final dateString =
          DateFormat(
            'yyyy-MM-dd HH:mm',
          ).format(date);

      final bank =
          detectBank(body);

      final merchant =
          detectMerchant(body);

      final account =
          detectAccount(body);

      final category =
          detectCategory(body);

      final upi =
          detectUpi(body);

      final reference =
          RegExp(
            r'(?i)(?:utr|ref(?:erence)?|txn|transaction)[\s:#-]*([A-Za-z0-9]+)',
          ).firstMatch(body)?.group(1);

      final duplicate =
          existing.any(
        (t) =>
            t.source == 'SMS' &&
            t.date == dateString &&
            (t.amount - amount)
                    .abs() <
                0.01 &&
            (t.reference == reference ||
                reference == null ||
                t.description ==
                    'SMS: $body'),
      );

      if (duplicate) {
        skipped++;
        continue;
      }

      final result =
          await showDialog<String>(
        context: context,
        builder: (dialogContext) {
          return AlertDialog(
            title: const Text(
              'SMS Transaction Detected',
            ),
            content:
                SingleChildScrollView(
              child: Column(
                crossAxisAlignment:
                    CrossAxisAlignment.start,
                children: [
                  Text(
                    'Amount: ₹${amount.toStringAsFixed(2)}',
                  ),
                  Text(
                    'Type: ${isIncome ? 'Credit' : 'Debit'}',
                  ),
                  Text(
                    'Bank: $bank',
                  ),
                  Text(
                    'Account: $account',
                  ),
                  if (merchant.isNotEmpty)
                    Text(
                      'Merchant: $merchant',
                    ),
                  if (upi.isNotEmpty)
                    Text(
                      'Mode: $upi',
                    ),
                  Text(
                    'Date: $dateString',
                  ),
                  const Divider(),
                  Text(body),
                ],
              ),
            ),
            actions: [
              TextButton(
                onPressed: () =>
                    Navigator.pop(
                  dialogContext,
                  'skip',
                ),
                child: const Text(
                  'Skip',
                ),
              ),
              TextButton(
                onPressed: () =>
                    Navigator.pop(
                  dialogContext,
                  'edit',
                ),
                child: const Text(
                  'Edit',
                ),
              ),
              ElevatedButton(
                onPressed: () =>
                    Navigator.pop(
                  dialogContext,
                  'add',
                ),
                child: const Text(
                  'Add',
                ),
              ),
            ],
          );
        },
      );

      if (result == 'skip') {
        skipped++;
        continue;
      }

      if (result == 'edit') {
        await editSmsTransaction(
          amount: amount,
          isIncome: isIncome,
          account: account,
          category: category,
          date: dateString,
          body: body,
          bank: bank,
          merchant: merchant,
          reference: reference,
        );

        added++;
        continue;
      }

      if (result == 'add') {
        await DB.insertTransaction(
          TransactionModel(
            amount: amount,
            type:
                isIncome ? 'Income' : 'Expense',
            account: account,
            category: category,
            subCategory:
                upi.isNotEmpty ? 'UPI' : '',
            date: dateString,
            description:
                merchant.isNotEmpty
                    ? '$merchant | SMS: $body'
                    : 'SMS: $body',
            bank: bank,
            merchant: merchant,
            reference: reference,
            source: 'SMS',
          ),
        );

        added++;
      }
    }

    await load();

    if (mounted) {
      ScaffoldMessenger.of(context)
          .showSnackBar(
        SnackBar(
          content: Text(
            '$added added • $skipped skipped/duplicate',
          ),
        ),
      );
    }
  }

  Future<void>editSmsTransaction({
    required double amount,
    required bool isIncome,
    required String account,
    required String category,
    required String date,
    required String body,
    required String bank,
    required String merchant,
    String? reference,
  }) async {
    final amountController =
        TextEditingController(
      text: amount.toStringAsFixed(2),
    );

    final descriptionController =
        TextEditingController(
      text: merchant.isNotEmpty
          ? merchant
          : body,
    );

    String selectedCategory =
        category;

    String selectedAccount =
        account;

    final categories =
        await DB.categories(
      isIncome ? 'Income' : 'Expense',
    );

    if (!categories.contains(
      selectedCategory,
    )) {
      selectedCategory =
          categories.first;
    }

    await showDialog(
      context: context,
      builder: (dialogContext) {
        return StatefulBuilder(
          builder: (
            context,
            setDialogState,
          ) {
            return AlertDialog(
              title: const Text(
                'Edit SMS Transaction',
              ),
              content:
                  SingleChildScrollView(
                child: Column(
                  children: [
                    TextField(
                      controller:
                          amountController,
                      keyboardType:
                          const TextInputType
                              .numberWithOptions(
                        decimal: true,
                      ),
                      decoration:
                          const InputDecoration(
                        labelText: 'Amount',
                      ),
                    ),
                    DropdownButtonFormField<String>(
                      value:
                          selectedAccount,
                      items: accounts
                          .map(
                            (x) =>
                                DropdownMenuItem(
                              value: x,
                              child: Text(x),
                            ),
                          )
                          .toList(),
                      onChanged: (value) {
                        if (value == null) {
                          return;
                        }

                        setDialogState(() {
                          selectedAccount =
                              value;
                        });
                      },
                    ),
                    DropdownButtonFormField<String>(
                      value:
                          selectedCategory,
                      items: categories
                          .map(
                            (x) =>
                                DropdownMenuItem(
                              value: x,
                              child: Text(x),
                            ),
                          )
                          .toList(),
                      onChanged: (value) {
                        if (value == null) {
                          return;
                        }

                        setDialogState(() {
                          selectedCategory =
                              value;
                        });
                      },
                    ),
                    TextField(
                      controller:
                          descriptionController,
                      decoration:
                          const InputDecoration(
                        labelText:
                            'Description',
                      ),
                    ),
                  ],
                ),
              ),
              actions: [
                TextButton(
                  onPressed: () =>
                      Navigator.pop(
                    dialogContext,
                  ),
                  child:
                      const Text('Cancel'),
                ),
                ElevatedButton(
                  onPressed: () async {
                    final value =
                        double.tryParse(
                              amountController
                                  .text,
                            ) ??
                            0;

                    if (value <= 0) {
                      return;
                    }

                    await DB
                        .insertTransaction(
                      TransactionModel(
                        amount: value,
                        type: isIncome
                            ? 'Income'
                            : 'Expense',
                        account:
                            selectedAccount,
                        category:
                            selectedCategory,
                        subCategory: '',
                        date: date,
                        description:
                            descriptionController
                                .text,
                        bank: bank,
                        merchant: merchant,
                        reference:
                            reference,
